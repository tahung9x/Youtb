name: Build Parallel Fermata Mod APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 1. Checkout mã nguồn kèm Submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: 2. Cài đặt JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 3. Patch lỗi dừng Video khi mở Map & Đổi tên hiển thị thành "Fermata Mod"
        run: |
          python3 - << 'EOF'
          import glob, re

          # --- 1. Đổi tên hiển thị (App Label) để phân biệt với bản gốc ---
          for xml_file in glob.glob("**/res/values*/strings.xml", recursive=True):
              with open(xml_file, "r", encoding="utf-8") as f:
                  content = f.read()
              new_content = content.replace('>Fermata Auto<', '>Fermata Mod<')
              new_content = new_content.replace('>Fermata Mirror<', '>Fermata Mirror Mod<')
              new_content = new_content.replace('>Fermata FS Mirror<', '>Fermata FS Mod<')
              new_content = new_content.replace('>Fermata Media Service<', '>Fermata Service Mod<')
              if new_content != content:
                  with open(xml_file, "w", encoding="utf-8") as f:
                      f.write(new_content)
                  print(f"Renamed app labels in: {xml_file}")

          # --- 2. Chặn YouTube phát hiện ẩn màn hình (Page Visibility API) ---
          for yt_js in glob.glob("**/assets/yt.js", recursive=True):
              with open(yt_js, "r", encoding="utf-8") as f:
                  content = f.read()
              patch_js = """
          Object.defineProperty(document, 'hidden', { get: () => false, configurable: true });
          Object.defineProperty(document, 'visibilityState', { get: () => 'visible', configurable: true });
          window.addEventListener('visibilitychange', e => e.stopImmediatePropagation(), true);
          document.addEventListener('visibilitychange', e => e.stopImmediatePropagation(), true);
          """
              with open(yt_js, "w", encoding="utf-8") as f:
                  f.write(patch_js + "\n" + content)
              print(f"Patched JS: {yt_js}")

          # --- 3. Giữ FermataWebView luôn chạy dưới nền khi nhìn Map ---
          for wv_file in glob.glob("**/FermataWebView.java", recursive=True):
              with open(wv_file, "r", encoding="utf-8") as f:
                  code = f.read()
              code = re.sub(r'@Override\s+protected void onWindowVisibilityChanged\(int visibility\)\s*\{[^}]*\}', '', code)
              code = re.sub(r'@Override\s+public void onPause\(\)\s*\{[^}]*\}', '', code)
              
              override_methods = """
              @Override
              protected void onWindowVisibilityChanged(int visibility) {
                  super.onWindowVisibilityChanged(android.view.View.VISIBLE);
              }

              @Override
              public void onPause() {
                  // Giữ luồng WebView chạy dưới nền khi xem Map
              }

              @Override
              public void pauseTimers() {
                  // Không đóng băng bộ đếm JS
              }
          }"""
              idx = code.rfind("}")
              if idx != -1:
                  code = code[:idx] + override_methods
                  with open(wv_file, "w", encoding="utf-8") as f:
                      f.write(code)
                  print(f"Patched WebView: {wv_file}")

          # --- 4. Ngăn MainActivityDelegate / VideoView tạm dừng MediaEngine khi mất Surface ---
          for delegate_file in glob.glob("**/MainActivityDelegate.java", recursive=True):
              with open(delegate_file, "r", encoding="utf-8") as f:
                  code = f.read()
              code = code.replace("getMediaServiceBinder().onPause();", "// getMediaServiceBinder().onPause();")
              with open(delegate_file, "w", encoding="utf-8") as f:
                  f.write(code)
              print(f"Patched Delegate: {delegate_file}")

          for vv_file in glob.glob("**/VideoView.java", recursive=True):
              with open(vv_file, "r", encoding="utf-8") as f:
                  code = f.read()
              code = re.sub(r'(public void surfaceDestroyed\([^{]+\{[^}]*?)(eng\.pause\(\);|b\.onPause\(\);)', r'\1// \2', code, flags=re.DOTALL)
              with open(vv_file, "w", encoding="utf-8") as f:
                  f.write(code)
              print(f"Patched VideoView: {vv_file}")
          EOF

      - name: 4. Biên dịch APK với Package ID riêng (.mod) và tự động Ký (Sign)
        run: |
          chmod +x gradlew
          # Dùng cờ -PAPP_ID_SFX=.mod để đổi package thành me.aap.fermata.auto.mod
          ./gradlew assembleAutoRelease -PAPP_ID_SFX=.mod -x lint -x test

          # Tạo keystore và ký tất cả file APK xuất ra để cài đặt trực tiếp không bị lỗi
          keytool -genkey -v -keystore mod-release.jks -keyalg RSA -keysize 2048 -validity 10000 -alias modkey -storepass 123456 -keypass 123456 -dname "CN=FermataMod, OU=Auto, O=Mod, L=HN, S=HN, C=VN"
          
          mkdir -p signed_apk
          BUILD_TOOLS_DIR=$(ls -d $ANDROID_HOME/build-tools/* | tail -n 1)
          
          for apk in $(find . -name "*auto-release*arm64*.apk"); do
              ALIGNED_APK="signed_apk/Fermata-Mod-Parallel-arm64.apk"
              $BUILD_TOOLS_DIR/zipalign -v -p 4 "$apk" "$ALIGNED_APK"
              $BUILD_TOOLS_DIR/apksigner sign --ks mod-release.jks --ks-pass pass:123456 --key-pass pass:123456 "$ALIGNED_APK"
              echo "Signed successfully: $ALIGNED_APK"
          done

      - name: 5. Tải file APK đã ký lên Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Fermata-Mod-APK
          path: signed_apk/*.apk
          
