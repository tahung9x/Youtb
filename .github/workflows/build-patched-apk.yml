name: Patch and Build Fermata APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 1. Checkout mã nguồn kèm Submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: 2. Cài đặt JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 3. Tự động Patch lỗi dừng Video/YouTube khi mở Map
        run: |
          python3 - << 'EOF'
          import os, glob, re

          # --- PATCH 1: Chặn YouTube phát hiện ẩn màn hình (Page Visibility API) ---
          for yt_js in glob.glob("**/assets/yt.js", recursive=True):
              with open(yt_js, "r", encoding="utf-8") as f:
                  content = f.read()
              patch_js = """
          Object.defineProperty(document, 'hidden', { get: () => false, configurable: true });
          Object.defineProperty(document, 'visibilityState', { get: () => 'visible', configurable: true });
          window.addEventListener('visibilitychange', e => e.stopImmediatePropagation(), true);
          document.addEventListener('visibilitychange', e => e.stopImmediatePropagation(), true);
          """
              with open(yt_js, "w", encoding="utf-8") as f:
                  f.write(patch_js + "\n" + content)
              print(f"Patched JS: {yt_js}")

          # --- PATCH 2: Giữ FermataWebView luôn chạy khi chuyển sang ứng dụng Map ---
          for wv_file in glob.glob("**/FermataWebView.java", recursive=True):
              with open(wv_file, "r", encoding="utf-8") as f:
                  code = f.read()
              # Xóa các hàm onPause / onWindowVisibilityChanged cũ nếu có để tránh trùng lặp
              code = re.sub(r'@Override\s+protected void onWindowVisibilityChanged\(int visibility\)\s*\{[^}]*\}', '', code)
              code = re.sub(r'@Override\s+public void onPause\(\)\s*\{[^}]*\}', '', code)
              
              override_methods = """
              @Override
              protected void onWindowVisibilityChanged(int visibility) {
                  super.onWindowVisibilityChanged(android.view.View.VISIBLE);
              }

              @Override
              public void onPause() {
                  // Giữ luồng WebView chạy dưới nền khi xem Map
              }

              @Override
              public void pauseTimers() {
                  // Không đóng băng bộ đếm JS
              }
          }"""
              idx = code.rfind("}")
              if idx != -1:
                  code = code[:idx] + override_methods
                  with open(wv_file, "w", encoding="utf-8") as f:
                      f.write(code)
                  print(f"Patched WebView: {wv_file}")

          # --- PATCH 3: Ngăn MainActivityDelegate / VideoView tạm dừng MediaEngine khi mất Surface ---
          for delegate_file in glob.glob("**/MainActivityDelegate.java", recursive=True):
              with open(delegate_file, "r", encoding="utf-8") as f:
                  code = f.read()
              # Vô hiệu hóa lệnh pause tự động khi CarActivity rơi vào onPause/onStop nếu đang phát video
              code = code.replace("getMediaServiceBinder().onPause();", "// getMediaServiceBinder().onPause();")
              with open(delegate_file, "w", encoding="utf-8") as f:
                  f.write(code)
              print(f"Patched Delegate: {delegate_file}")

          for vv_file in glob.glob("**/VideoView.java", recursive=True):
              with open(vv_file, "r", encoding="utf-8") as f:
                  code = f.read()
              # Đảm bảo khi surfaceDestroyed chỉ tách surface chứ không dừng phát
              code = re.sub(r'(public void surfaceDestroyed\([^{]+\{[^}]*?)(eng\.pause\(\);|b\.onPause\(\);)', r'\1// \2', code, flags=re.DOTALL)
              with open(vv_file, "w", encoding="utf-8") as f:
                  f.write(code)
              print(f"Patched VideoView: {vv_file}")
          EOF

      - name: 4. Đóng gói thành file APK hoàn chỉnh (Bản Auto Release)
        run: |
          chmod +x gradlew
          ./gradlew assembleAutoRelease -x lint -x test

      - name: 5. Xuất file APK để tải về
        uses: actions/upload-artifact@v4
        with:
          name: Fermata-Auto-Mod-BackgroundPlay
          path: |
            **/*.apk
            
